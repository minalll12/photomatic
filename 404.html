<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Photomatic</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Playfair Display"; font-style: normal; font-weight: 400 900; font-display: swap; src: url("/assets/fonts/playfair-display-normal.woff2") format("woff2"); }
    @font-face { font-family: "Playfair Display"; font-style: italic; font-weight: 400 900; font-display: swap; src: url("/assets/fonts/playfair-display-italic.woff2") format("woff2"); }
    @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400 800; font-display: swap; src: url("/assets/fonts/dm-sans-normal.woff2") format("woff2"); }
    @font-face { font-family: "Special Elite"; font-style: normal; font-weight: 400; font-display: swap; src: url("/assets/fonts/special-elite-normal.woff2") format("woff2"); }
    @font-face { font-family: "UnifrakturMaguntia"; font-style: normal; font-weight: 400; font-display: swap; src: url("/assets/fonts/unifrakturmaguntia-normal.woff2") format("woff2"); }
    :root {
      --ink: #1F1A17; --muted: #5C4B41; --cream: #F4EEE3; --oxblood: #3A0A0E; --cherry: #B3202A; --gold: #B8934A;
      --ease-calm: cubic-bezier(.22, .61, .36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100svh;
      color: var(--ink);
      font: 400 1rem / 1.55 "DM Sans", system-ui, sans-serif;
      /* the cream wall of the arcade corner, a soft lamp from above */
      background:
        radial-gradient(60% 50% at 50% 18%, rgb(255 226 160 / .35), transparent 70%),
        repeating-linear-gradient(90deg, rgb(184 147 74 / .07) 0 2px, transparent 2px 34px),
        #F1E8D6;
    }
    .bar { display: flex; align-items: center; height: 60px; padding: 0 max(16px, 4vw); background: #2A070A; }
    .bar a { color: var(--cream); font: 400 1.75rem / 1 "UnifrakturMaguntia", serif; text-decoration: none; text-shadow: 2px 2px 0 #5E1C23; }
    main { display: grid; place-content: center; justify-items: center; gap: 24px; padding: 48px 16px 64px; text-align: center; }
    /* a print that never came up: grey paper on a brass tack */
    .print { position: relative; width: 168px; padding: 12px 12px 40px; background: #FBFAF6; box-shadow: 0 14px 28px rgb(42 33 28 / .28), 0 2px 4px rgb(42 33 28 / .2); transform: rotate(-3deg); }
    .print::before { content: ""; position: absolute; left: 50%; top: -9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F6E2A6, #C9A24E 55%, #7A5C24); box-shadow: 0 2px 3px rgb(42 33 28 / .4); }
    .print span { display: block; aspect-ratio: 4 / 3; background: linear-gradient(160deg, #C9C2B6, #A9A196); }
    .print small { position: absolute; left: 0; right: 0; bottom: 12px; font: 400 .75rem / 1 "Special Elite", monospace; letter-spacing: .08em; color: var(--muted); }
    .kicker { margin: 0; font: 400 .875rem / 1 "Special Elite", monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--cherry); }
    h1 { margin: 0; font: 700 clamp(2.25rem, 1.4rem + 3.4vw, 3.75rem) / 1.08 "Playfair Display", Georgia, serif; }
    h1 em { font-weight: 500; color: var(--cherry); }
    p.line { max-width: 34ch; margin: 0; color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 32px;
      border: 1px solid var(--gold); border-radius: 3px; color: var(--cream); text-decoration: none;
      font: 500 .9375rem / 1 "DM Sans", system-ui, sans-serif; letter-spacing: .02em;
      background: radial-gradient(110% 120% at 0% 0%, rgb(150 52 62 / .35), transparent 62%), var(--oxblood);
      box-shadow: inset 0 0 0 3px var(--oxblood), inset 0 0 0 4px rgb(226 194 122 / .28), 0 6px 14px rgb(42 33 28 / .3);
      transition: background-color 250ms var(--ease-calm), border-color 250ms var(--ease-calm), transform 250ms var(--ease-calm);
    }
    .btn:hover { background-color: #4E1218; border-color: #E2C27A; transform: translateY(-1px); }
    .btn:focus-visible { outline: 2px solid var(--oxblood); outline-offset: 3px; }
  </style>
</head>
<body>
  <header class="bar"><a href="/" aria-label="Photomatic, home">Photomatic</a></header>
  <main>
    <div class="print" aria-hidden="true"><span></span><small>No. 404</small></div>
    <p class="kicker">— Page not found —</p>
    <h1>This frame didn’t <em>develop.</em></h1>
    <p class="line">The page you were after isn’t here. The booth is still warm, though.</p>
    <a class="btn" href="/#booth">Back to the booth <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </main>
</body>
</html>
